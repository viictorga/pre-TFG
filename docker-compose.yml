services:
  postgres:
    image: postgres:16
    container_name: tfg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: iot
      POSTGRES_USER: tfg
      POSTGRES_PASSWORD: tfg_pass
    ports:
      - "5432:5432"
    # wal_level=logical ya deja Postgres listo para cuando conectemos Debezium (CDC)
    command: ["postgres", "-c", "wal_level=logical"]
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tfg -d iot"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Fase 2: CDC en streaming ---

  zookeeper:
    image: quay.io/debezium/zookeeper:2.7
    container_name: tfg-zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"

  kafka:
    image: quay.io/debezium/kafka:2.7
    container_name: tfg-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      ZOOKEEPER_CONNECT: zookeeper:2181
    depends_on:
      - zookeeper

  connect:
    image: quay.io/debezium/connect:2.7
    container_name: tfg-connect
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_status
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy

  # --- Fase 3: Spark + Iceberg (lakehouse) ---
  # Sigue el patrón oficial de iceberg.apache.org/spark-quickstart, verificado
  # contra el docker-compose.yml real del proyecto antes de escribir esto.

  spark-iceberg:
    image: tabulario/spark-iceberg:3.5.5_1.8.1
    container_name: tfg-spark
    restart: unless-stopped
    depends_on:
      - rest
      - minio
      - kafka
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
    ports:
      - "8888:8888"   # Jupyter (opcional, no lo usamos todavía)
      - "8080:8080"   # Spark UI
      - "10000:10000"
      - "10001:10001"
    volumes:
      - ./warehouse:/home/iceberg/warehouse
      - ./notebooks:/home/iceberg/notebooks/notebooks
      - ./spark-scripts:/home/iceberg/scripts

  rest:
    image: apache/iceberg-rest-fixture
    container_name: tfg-iceberg-rest
    restart: unless-stopped
    ports:
      - "8181:8181"
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000

  minio:
    image: minio/minio
    container_name: tfg-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
      MINIO_DOMAIN: minio
    networks:
      default:
        aliases:
          - warehouse.minio
    ports:
      - "9001:9001"   # consola web de MinIO
      - "9000:9000"
    command: ["server", "/data", "--console-address", ":9001"]

  # Contenedor auxiliar que solo crea el bucket "warehouse" al arrancar y
  # luego se queda dormido. No sirve para nada más.
  mc:
    image: minio/mc
    container_name: tfg-mc
    depends_on:
      - minio
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set minio http://minio:9000 admin password) do echo '...esperando a minio...' && sleep 1; done;
      /usr/bin/mc mb --ignore-existing minio/warehouse;
      tail -f /dev/null
      "

volumes:
  pgdata: